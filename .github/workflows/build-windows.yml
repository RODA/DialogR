name: build Windows intel

on:
  workflow_dispatch:
    inputs:
      dialogforge_ref:
        description: DialogForge branch, tag, or commit SHA.
        required: false
        default: ""
        type: string
      publish_signed_release:
        description: Also request signing and upload to a GitHub release.
        required: false
        default: true
        type: boolean
      release_tag:
        description: Release tag to upload signed artifacts to (used when publishing).
        required: false
        default: latest
        type: string
      release_repository:
        description: Target release repository in owner/repo form (used when publishing).
        required: false
        default: RODA/DialogR
        type: string
      overwrite_release_assets:
        description: Replace existing release assets with matching filenames (used when publishing).
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out product
        uses: actions/checkout@v5
        with:
          path: product

      - name: Check out DialogForge
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DIALOGFORGE_REPOSITORY || 'dusadrian/DialogForge' }}
          ref: ${{ inputs.dialogforge_ref != '' && inputs.dialogforge_ref || vars.DIALOGFORGE_REF || 'main' }}
          path: DialogForge

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: DialogForge/package-lock.json

      - name: Install DialogForge dependencies
        working-directory: DialogForge
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "npm ci failed on attempt $attempt; retrying..."
            sleep 15
          done

      # Match the immutable native helpers in DialogForge/vendor/r-runtime/native.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Build Windows artifact
        working-directory: product
        run: npm run build

      - name: Install native dialog test dependencies
        working-directory: product
        run: |
          Rscript scripts/install-test-r-dependencies.R statistics declared later jsonlite cli rlang
          node scripts/check-release-r.js --github-env

      - name: Verify native dialog data workflows
        working-directory: product
        env:
          DIALOGFORGE_SOURCE_ROOT: ${{ github.workspace }}/DialogForge
          DIALOGFORGE_DIST_DIR: ${{ github.workspace }}/product/dist
        run: npm run test:dialogs:native

      - name: Verify packaged application, menus, console, help and Script Editor
        working-directory: DialogForge
        run: node scripts/verify-production-electron.js --product-path ../product --output-dir ../product/build/output

      - name: Retain native dialog test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dialog-workflows-${{ runner.os }}
          path: product/artifacts/dialog-release/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dialogr-windows
          path: |
            product/build/output/*.exe
            product/build/output/*.exe.blockmap
            product/build/output/latest.yml
          if-no-files-found: error

  request-signing:
    if: ${{ inputs.publish_signed_release }}
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Sign and verify Windows release upload
        env:
          GH_TOKEN: ${{ secrets.DIALOGFORGE_SIGNING_TOKEN }}
          PRODUCT_REF: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REPOSITORY: ${{ inputs.release_repository }}
          OVERWRITE_RELEASE_ASSETS: ${{ inputs.overwrite_release_assets }}
        run: bash scripts/publish-windows-via-broker.sh
